apiVersion: v1
kind: Service
metadata:
  name: domaine-des-reves-bleus-backend-service
  namespace: domaine-des-reves-bleus
spec:
  selector:
    app: domaine-des-reves-bleus-backend
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domaine-des-reves-bleus-backend
  namespace: domaine-des-reves-bleus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: domaine-des-reves-bleus-backend
  template:
    metadata:
      labels:
        app: domaine-des-reves-bleus-backend
    spec:
      containers:
      - name: backend
        image: domaine-des-reves-bleus-back:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8000
        workingDir: /app
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
          readOnly: false
        - name: secrets
          mountPath: /app/secrets
          readOnly: true
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8000"
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: stripe-webhook-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: jwt-secret
        - name: MARIADB_HOST
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-host
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-user
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-password
        - name: MARIADB_DATABASE
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-database
        - name: MARIADB_PORT
          value: "3306"
        - name: FRONTEND_URL
          value: "https://domainedesrevesbleus.eu"
        - name: EMAIL_SERVICE_URL
          value: "http://email-service.email-service.svc.cluster.local:8080"
        - name: JWT_PRIVATE_KEY_PATH
          value: "/app/secrets/jwt_private_key.pem"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: uploads
        emptyDir: {}
      - name: secrets
        secret:
          secretName: domaine-des-reves-bleus-secrets
          items:
          - key: jwt-private-key
            path: jwt_private_key.pem
          - key: jwt-public-key
            path: jwt_public_key.pem