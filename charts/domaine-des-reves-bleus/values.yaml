# values.yaml — Domaine des Rêves Bleus (prod)
# Les images sont mises à jour automatiquement par la CI (build-and-push.yml)
# Format : ghcr.io/<owner>/<nom>@sha256:<digest>  (piqué par la CI)

namespace: domaine-des-reves-bleus

# ── Secret Kubernetes (déployé via SealedSecret dans templates/) ──────────────
secretName: domaine-des-reves-bleus-secrets

# ── Backend (Node.js) ─────────────────────────────────────────────────────────
backend:
  image: ghcr.io/emmguardia/domaine-des-reves-bleus-back@sha256:5b906b6773cd7be75b31e9ca96e429c0afa2d0d9c0199ddb6ae7181044a97a21
  imagePullPolicy: IfNotPresent
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8000
  env:
    NODE_ENV: production
    PORT: "8000"
    FRONTEND_URL: "https://domainedesrevesbleus.eu"
    EMAIL_SERVICE_URL: "http://email-service.email-service.svc.cluster.local:8080"
    ADMIN_EMAIL: "domainedesrevesbleus@gmail.com"
    MARIADB_PORT: "3306"
    JWT_PRIVATE_KEY_PATH: "/app/secrets/jwt_private_key.pem"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    cpuTarget: 70
    memoryTarget: 80
  metrics:
    # Mettre à true si Prometheus Operator est installé (kube-prometheus-stack)
    # pour activer le ServiceMonitor de scraping automatique.
    # L'endpoint /api/metrics est toujours exposé, indépendamment de ce flag.
    enabled: false
    scrapeInterval: 30s

# ── Frontend (nginx) ──────────────────────────────────────────────────────────
frontend:
  image: ghcr.io/emmguardia/domaine-des-reves-bleus-front@sha256:c7accb4a9211927fecd0770f6dbd88ec9302d7c7bc170ab492b780ffcf3206bb
  imagePullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuTarget: 70
    memoryTarget: 80
