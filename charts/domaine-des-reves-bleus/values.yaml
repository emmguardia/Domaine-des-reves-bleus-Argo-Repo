# values.yaml — Domaine des Rêves Bleus (prod)
# Les images sont mises à jour automatiquement par la CI (build-and-push.yml)
# Format : ghcr.io/<owner>/<nom>@sha256:<digest>  (piqué par la CI)

namespace: domaine-des-reves-bleus

# ── Secret Kubernetes (déployé via SealedSecret dans templates/) ──────────────
secretName: domaine-des-reves-bleus-secrets

# ── Backend (Node.js) ─────────────────────────────────────────────────────────
backend:
  image: ghcr.io/emmguardia/domaine-des-reves-bleus-back@sha256:abf982537110114d9778dd567881318579917da66e8a0329d43cd925530d29ce
  imagePullPolicy: IfNotPresent
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8000
  env:
    NODE_ENV: production
    PORT: "8000"
    FRONTEND_URL: "https://domainedesrevesbleus.eu"
    EMAIL_SERVICE_URL: "http://email-service.email-service.svc.cluster.local:8080"
    ADMIN_EMAIL: "domainedesrevesbleus@gmail.com"
    MARIADB_PORT: "3306"
    JWT_PRIVATE_KEY_PATH: "/app/secrets/jwt_private_key.pem"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    cpuTarget: 70
    memoryTarget: 80
  metrics:
    # Mettre à true si Prometheus Operator est installé (kube-prometheus-stack)
    # pour activer le ServiceMonitor de scraping automatique.
    # L'endpoint /api/metrics est toujours exposé, indépendamment de ce flag.
    enabled: false
    scrapeInterval: 30s

# ── Frontend (nginx) ──────────────────────────────────────────────────────────
frontend:
  image: ghcr.io/emmguardia/domaine-des-reves-bleus-front@sha256:4d303bd14f2ed543b180afdd516b5d17a91e45c1d555536f294c6aa17be4cd53
  imagePullPolicy: IfNotPresent
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  port: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuTarget: 70
    memoryTarget: 80
