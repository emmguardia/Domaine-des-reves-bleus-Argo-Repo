apiVersion: v1
kind: Service
metadata:
  name: domaine-des-reves-bleus-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "drb.labels" . | nindent 4 }}
    {{- include "drb.backend.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "drb.backend.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
