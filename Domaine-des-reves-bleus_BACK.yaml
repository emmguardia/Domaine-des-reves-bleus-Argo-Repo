apiVersion: apps/v1
kind: Deployment
metadata:
  name: domaine-des-reves-bleus-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: domaine-des-reves-bleus-backend
  template:
    metadata:
      labels:
        app: domaine-des-reves-bleus-backend
    spec:
      initContainers:
      - name: install-dependencies
        image: python:3.11-slim
        workingDir: /app
        command: ["/bin/sh"]
        args: ["-c", "pip install --no-cache-dir -r requirements.txt"]
        volumeMounts:
        - name: backend-code
          mountPath: /app
      containers:
      - name: backend
        image: python:3.11-slim
        workingDir: /app
        command: ["uvicorn"]
        args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        env:
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: stripe-webhook-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: jwt-secret
        - name: MARIADB_HOST
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-host
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-user
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-password
        - name: MARIADB_DATABASE
          valueFrom:
            secretKeyRef:
              name: domaine-des-reves-bleus-secrets
              key: mariadb-database
        - name: FRONTEND_URL
          value: "https://domainedesrevesbleus.famillemntmata.eu"
        - name: PORT
          value: "8000"
        volumeMounts:
        - name: backend-code
          mountPath: /app
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: backend-code
        persistentVolumeClaim:
          claimName: domaine-des-reves-bleus-backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: domaine-des-reves-bleus-backend-service
  namespace: default
spec:
  selector:
    app: domaine-des-reves-bleus-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: domaine-des-reves-bleus-backend-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

