server {
    listen 8080;
    server_name domainedesrevesbleus.eu www.domainedesrevesbleus.eu;

    if ($host = www.domainedesrevesbleus.eu) {
        return 301 $scheme://domainedesrevesbleus.eu$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$ ) {
        return 405;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8" always;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }
    
    location = /robots.txt {
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        access_log off;
    }

    location / {
        if ($request_uri ~ ^(.+)/$) {
            return 301 $1;
        }
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }
    
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
    }

    location /api/ {
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    gzip_comp_level 6;
    gzip_disable "msie6";
}
