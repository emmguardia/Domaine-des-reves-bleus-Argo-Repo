server {
    listen 8080;
    server_name domainedesrevesbleus.eu www.domainedesrevesbleus.eu;

    if ($host = www.domainedesrevesbleus.eu) {
        return 301 $scheme://domainedesrevesbleus.eu$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # ── Blocage scanners / fichiers sensibles ────────────────────────────────
    # Retourne 404 immédiatement pour tous les chemins typiques de bots malveillants.
    # Évite de servir l'index.html du SPA (qui renvoyait faussement un 200).

    # Fichiers d'environnement et credentials
    location ~* /\.env($|\.|/) { return 404; }
    location ~* /\.git(/|$)    { return 404; }
    location ~* /\.aws(/|$)    { return 404; }
    location ~* /\.ssh(/|$)    { return 404; }

    # Fichiers de configuration sensibles (regex insensible à la casse)
    location ~* \.(env|env\..+|bak|backup|save|old|swp|sql|log|key|pem|p12|pfx)$ {
        return 404;
    }

    # Paths PHP / debug / admin communs scannés par les bots
    location ~* ^/(phpinfo|info|test|wp-login|wp-admin|phpmyadmin|adminer|shell|webshell|backdoor|eval|upload|cgi-bin|xmlrpc)\.?(php|asp|aspx|jsp)?(/|$) {
        return 404;
    }

    # Fichiers de config cloud / CI scannés
    location ~* ^/(aws\.json|aws-credentials|aws-config|s3cfg|\.s3cfg|\.npmrc|\.dockerenv|docker-compose\.yml|Dockerfile|package\.json|composer\.json|\.htaccess|web\.config|config\.js|aws\.config\.js)$ {
        return 404;
    }

    # Debugbars et outils de dev
    location ~* ^/(_debugbar|debugbar|debug|telescope|horizon|nova|clockwork)(/|$) {
        return 404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8" always;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }
    
    location = /robots.txt {
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        access_log off;
    }

    location / {
        if ($request_uri ~ ^(.+)/$) {
            return 301 $1;
        }
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }
    
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
    }

    location /api/ {
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_redirect off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    gzip_comp_level 6;
    gzip_disable "msie6";
}
