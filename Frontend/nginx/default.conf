server {
    listen 80;
    server_name _;

    # Si Cloudflare gère déjà la redirection HTTPS, cette section peut être ignorée
    # Mais on peut aussi forcer HTTPS ici si nécessaire
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;
    
    # Headers de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        # S'assurer que les fichiers sont servis correctement
        try_files $uri =404;
    }
    
    # S'assurer que les fichiers CSS sont servis avec le bon Content-Type
    location ~* \.css$ {
        add_header Content-Type "text/css; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
    
    # S'assurer que les fichiers JS sont servis avec le bon Content-Type
    location ~* \.js$ {
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy des requêtes API vers le backend Kubernetes
    location /api/ {
        # SANS le / à la fin : Nginx conserve le préfixe /api/ dans l'URL envoyée au backend
        # Le backend FastAPI attend /api/cart/ (avec le préfixe /api/)
        proxy_pass http://domaine-des-reves-bleus-backend-service.domaine-des-reves-bleus.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        
        # Gérer la redirection 307 de FastAPI (ajout automatique du slash final)
        proxy_redirect off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}

